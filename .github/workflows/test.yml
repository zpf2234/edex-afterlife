name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: src
      - name: Download the Electron binary
        run: npx electron --version
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
          E2E_SETTLE: 3000
          E2E_TIMEOUT: 150000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
